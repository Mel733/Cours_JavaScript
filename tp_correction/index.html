<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Gestionnaire de Tâches</title>
   <link rel="stylesheet" href="asset/app.css">
       
</head>
<body>
    <h1>🚀 Ma Todo List</h1>
    
    <!-- Zone d'ajout -->
    <div>
        <input type="text" id="newTask" placeholder="Nouvelle tâche...">
        <button id="addBtn">Ajouter</button>
    </div>
    
    <!-- Filtres -->
    <div>
        <button id="filterAll" data-filter ="all">Toutes</button>
        <button id="filterPending" data-filter="pending">En cours</button>
        <button id="filterCompleted" data-filter="completed">Terminées</button>
    </div>
    
    <!-- Liste des tâches -->
    <div id="taskList"></div>
    
    <script src="asset/style.js">
        // Votre code JavaScript ici
    </script>
</body>
</html>
